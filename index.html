<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>连连看</title><link rel="stylesheet" href="style.css"></head>
<body>
<div class="wrap">
  <h1>连连看</h1>
  <div class="stats">
    <span>分数 <b id="score">0</b></span><span>关卡 <b id="level">1</b></span><span>生命 <b id="lives">3</b></span>
    <span>时间 <b id="time">0</b></span><span>剩余 <b id="left">0</b></span><span>步数 <b id="moves">0</b></span>
    <span>配对 <b id="pairs">0</b></span><span>最佳 <b id="best">0</b></span><span>你 <b id="you">0</b></span>
    <span>电脑 <b id="cpu">0</b></span><span>平 <b id="draw">0</b></span><span>速度 <b id="wpm">0</b></span>
    <span>正确率 <b id="acc">100</b></span><span>金币 <b id="coins">100</b></span><span>次数 <b id="tries">0</b></span><span>题 <b id="q">1</b></span>
  </div>
  <div class="stage"><canvas id="game" width="480" height="400"></canvas>
    <div id="overlay" class="overlay hidden"><div class="ovbox"><h2 id="ov-title">游戏结束</h2><p id="ov-sub"></p><button id="ov-btn">再来一局</button></div></div>
  </div>
  <div class="bar"><button id="new">重新开始</button><span class="tip">键盘 / 鼠标 / 触屏均可操作</span></div>
</div>
<script src="game.js"></script>
</body></html>
